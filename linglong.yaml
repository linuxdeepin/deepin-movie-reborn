version: "1"

package:
  id: org.deepin.movie
  name: "deepin-movie"
  version: 6.5.60.1
  kind: app
  description: |
    movie for deepin os.

base: org.deepin.base/25.2.2
runtime: org.deepin.runtime.dtk/6.7.0

# deepin-gpuinfo 源码：官方 sources 方式引入（git + commit 固定版本，构建可复现）
sources:
  - kind: git
    url:  https://gerrit.uniontech.com/deepin-gpuinfo
    commit: 59ba03551485cf5dab468169bcb46af0e864eccc

command:
  - deepin-movie

# 声明式构建/运行依赖（替代手动 apt download + install_dep/deploy_dep 解包）：
# 1. 基础环境已具备的工具链与开发包不再声明：
#    - gcc/g++/cmake/make/pkg-config 由 base 的 develop 模块提供
#    - Qt6/DTK6 全套 dev、libxcb1-dev、libx11-dev、libwayland-dev、libglib2.0-dev
#      等由 runtime 的 develop 模块提供
# 2. build_depends 仅保留 base/runtime 缺失的编译依赖；
#    depends 仅保留运行期缺失的库与工具，传递依赖（blas/lapack/avdevice 等）由 apt 闭包自动解析
buildext:
  apt:
    build_depends:
      - libmpv-dev
      - libffmpegthumbnailer-dev
      - libxcb-util-dev        # xcb/xcb_aux.h（mpv_proxy.cpp）
      - libxcb-shape0-dev      # pkg_check xcb-shape
      - libxtst-dev            # X11/extensions/record.h + -lXtst（鼠标事件监听）
      - libavcodec-dev
      - libavformat-dev
      - libavutil-dev          # libavutil/hwcontext.h、dict.h 等
      - libdvdnav-dev
      - libgsettings-qt-dev    # QGSettings 头文件
      - libva-dev              # va/va_x11.h；deepin-gpuinfo 源码构建（libva-drm/x11/wayland）
      - libvdpau-dev           # deepin-gpuinfo 源码构建（vdpau）
      - libpciaccess-dev       # deepin-gpuinfo 源码构建（pciaccess）
      - libdrm-dev             # libdrm + libva-drm
      - libgstreamer1.0-dev
      - libgstreamer-plugins-base1.0-dev  # gst/pbutils
      - libmpris-qt6-dev
    depends:
      # 应用通过 QLibrary dlopen 裸名 so，仅 -dev 包提供无版本号软链，
      # 并经传递依赖带入 libmpv2 及 ffmpeg 全套运行库
      - libmpv-dev
      - libffmpegthumbnailer-dev
      - deepin-event-log       # dlopen libdeepin-event-log.so
      - libmpris-qt6
      - ffmpeg                 # 工具箱调用 ffmpeg 转码
      - pciutils               # lspci（GPU 信息）
      - x11-utils              # xprop（窗口属性）

permissions:
  binds:
    - source: /var/log
      destination: /var/log

build: |
  # 调整头文件查找路径：glib 开发文件位于 runtime 层（/runtime/include），
  # gstreamer 开发文件经 buildext 装入 /usr/include，与源码硬编码路径一致，无需调整
  sed -i "s|/usr/include/glib-2.0|/runtime/include/glib-2.0|g" src/CMakeLists.txt
  sed -i "s|/usr/include/glib-2.0|/runtime/include/glib-2.0|g" src/libdmr/CMakeLists.txt

  # ================= 从源码构建 libgpuinfo =================
  # 源码来自上方 sources 段
  GPUINFO_SRC=""
  for d in /project/linglong/sources/deepin-gpuinfo /project/sources/deepin-gpuinfo /source/deepin-gpuinfo; do
      if [ -f "$d/CMakeLists.txt" ]; then GPUINFO_SRC="$d"; break; fi
  done
  if [ -z "$GPUINFO_SRC" ]; then
      GPUINFO_SRC=$(find /project -maxdepth 4 -path "*deepin-gpuinfo*/CMakeLists.txt" 2>/dev/null | head -1 | xargs -r dirname)
  fi
  if [ ! -f "$GPUINFO_SRC/CMakeLists.txt" ]; then
      echo "ERROR: 未找到 deepin-gpuinfo 源码，sources 拉取失败？检查构建机 gerrit 访问权限" >&2
      exit 1
  fi
  echo ">>> libgpuinfo 源码: $GPUINFO_SRC (commit: $(git -C $GPUINFO_SRC rev-parse --short HEAD 2>/dev/null || echo unknown))"
  cd /project
  # 增量构建会复用容器 /tmp，旧 CMakeCache 可能指向旧源码路径，先清理
  rm -rf /tmp/gpuinfo-build
  cmake -B /tmp/gpuinfo-build -S "$GPUINFO_SRC" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PREFIX
  cmake --build /tmp/gpuinfo-build --target gpuinfo -j`nproc`
  # 安装到 $PREFIX/lib 与 $PREFIX/share（默认模块规则随应用层分发）
  install -d -m 0755 $PREFIX/lib/${TRIPLET} $PREFIX/share/deepin-gpuinfo
  install -m 0755 /tmp/gpuinfo-build/src/libgpuinfo/libgpuinfo.so.0.1.0 $PREFIX/lib/${TRIPLET}/
  ln -sf libgpuinfo.so.0.1.0 $PREFIX/lib/${TRIPLET}/libgpuinfo.so.0.1
  ln -sf libgpuinfo.so.0.1   $PREFIX/lib/${TRIPLET}/libgpuinfo.so
  install -m 0644 "$GPUINFO_SRC/config/gpuinfolib.csv" $PREFIX/share/deepin-gpuinfo/gpuinfolib.csv

  # libblas3/liblapack3 经 alternatives 提供顶层软链，指向 /etc/alternatives（层内不存在），
  # 将真实库复制进应用库目录，保证 ffmpeg 等运行期可解析（替代旧配方的 mv blas/lapack 逻辑）
  for n in libblas.so.3 liblapack.so.3; do
      src=$(readlink -f /usr/lib/${TRIPLET}/$n 2>/dev/null || true)
      if [ -n "$src" ] && [ -e "$src" ]; then
          cp -L "$src" $PREFIX/lib/${TRIPLET}/$n
      fi
  done

  # 刷新 ld 缓存，使 dlopen("libgpuinfo.so") 可解析源码构建的库
  ldconfig -C "$LINGLONG_LD_SO_CACHE"

  # 构建
  VERSION=$(head -1 debian/changelog | awk -F'[()]' '{print $2}')
  # 用独立目录 build-linglong 构建，避免与宿主机 build/ 的 CMakeCache 冲突
  cmake -B build-linglong ${conf_args} \
        -DSYSTEMD_USER_UNIT_DIR=${PREFIX}/lib/systemd/user \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_INSTALL_PREFIX=${PREFIX} \
        -DCMAKE_INSTALL_LIBDIR=${PREFIX}/lib/${TRIPLET} \
        -DVERSION=${VERSION}
  cmake --build build-linglong -j`nproc`
  cmake --build build-linglong --target install > install.log 2>&1

  # 解决GIO运行问题： Settings schema xxx is not installed
  glib-compile-schemas $PREFIX/share/glib-2.0/schemas
